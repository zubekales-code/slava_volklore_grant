# Nastavení agenta. Měnit se dá přímo na GitHubu (ikonka tužky), bez programování.

organization:
  name: "Sláva Volklore"
  # Současná a možné budoucí právní formy žadatele.
  # Výzvy jen pro jiné formy agent nezahodí, ale dá je do sekce „Až s jinou formou“.
  applicant_forms_now: ["OSVČ", "fyzická osoba podnikající", "spolek"]
  applicant_forms_future: ["s.r.o."]
  region: "Praha"

schedule:
  timezone: "Europe/Prague"
  send_hour: 7              # odesílá se v hodinu 7:xx pražského času
  every_n_days: 7           # 1 = denně, 2 = každý druhý den, 7 = jednou týdně
  anchor_date: "2026-10-19" # pondělí; od tohoto dne se počítá každý N-tý den (týdně = vždy pondělí)
  lookback_hours: 192       # jak daleko zpět sbírat (týden + rezerva)

email:
  to: ["slavavolkloreagent@gmail.com"]
  from_name: "Grantový agent Sláva Volklore"
  from_address: "onboarding@resend.dev"   # bez vlastní domény; po ověření domény změnit
  subject_prefix: "Granty a výzvy"

models:
  cheap: "gpt-5-mini"       # extrakce a hodnocení
  strong: "gpt-5"           # psaní souhrnu
  max_tokens_cheap: 8000
  max_tokens_strong: 16000
  effort_cheap: "low"       # kolik „přemýšlí“ levný model (minimal/low/medium/high); méně = levněji
  effort_strong: "medium"

selection:
  min_score: 6              # od kolika bodů z 10 jde výzva do e-mailu (fit, adapt)
  min_score_later: 7        # pro výzvy „až později“ (jiná forma, kapitál) přísněji, ať nejsou šum
  max_per_source: 3
  max_items_total: 25
  max_later: 5              # nejvýš tolik výzev „až později“ v jednom e-mailu
  deadline_soon_days: 30
  deadline_urgent_days: 7

finance:
  # Kolik vlastních peněz firma reálně zvládne vložit nebo předfinancovat. UPRAVTE podle skutečnosti.
  free_cash_czk: 150000

collect:
  priorities: [1, 2, 3]     # které priority zdrojů číst
  request_timeout: 25
  use_reader_fallback: true # při blokaci zkusit čtečku r.jina.ai
  max_chars_per_source: 14000   # kolik textu z jedné stránky jde k analýze
  max_grants_per_page: 8
  workers_fetch: 8
  workers_llm: 5
